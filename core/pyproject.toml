[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS — local voice assistant daemon"
requires-python = ">=3.11"

dependencies = [
    # audio i/o + speech
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17",
    "silero-vad>=5.1",
    "parakeet-mlx>=0.3.0 ; platform_machine == 'arm64'",
    "mlx-whisper>=0.4.0 ; platform_machine == 'arm64'",
    "kokoro>=0.9.4",
    "soundfile>=0.12",

    # llm
    "ollama>=0.4.0",
    "openai>=1.60",

    # integrations
    "httpx>=0.27",

    # global hotkey (needs macOS Accessibility permission)
    "pynput>=1.7.7",

    # plumbing
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "websockets>=13.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
jarvis = "jarvis.__main__:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"
